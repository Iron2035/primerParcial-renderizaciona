<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer parcial - Renderizacion de lista</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Parcial 1 | Division 132</h1>
    </header>
    
    <main>
        <h2 id="titulo-usuarios">Users</h2>

        <hr>

        <div class="controles">*

            <div class="controles-sin-busqueda">

                <div class="filtros">

                    <label><input type="radio" name="estado" value="active" checked> Active</label>
                    <label><input type="radio" name="estado" value="inactive" checked> Unactive</label>
                    <label><input type="radio" name="estado" value="all" checked> All</label>
                </div>

                <div class="botones">

                    <button type="button">Create</button>
                    <button type="button">Deactivate</button>
                    <button type="button">Reset Password</button>
                </div>
            </div>

            <input type="search" class="barra-busqueda" placeholder="Search Users">
        </div>

        <div id="users-container"></div>
        

    </main>
    
    
    <footer><p>Aaron Ezequiel Piñeiro</p></footer>

    <script src="index.js"></script>
</body>
</html>
